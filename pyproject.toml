[project]
name = "tair-infer"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==0.28.0",
    "bitsandbytes==0.44.1",
    "einops==0.7.0",
    "facexlib==0.3.0",
    "fairscale==0.4.4",
    "ftfy==6.2.0",
    "gdown>=6.1.0",
    "gradio==4.43.0",
    "lpips==0.1.4",
    "ninja>=1.13.0",
    "omegaconf==2.3.0",
    "opencv-python==4.9.0.80",
    "packaging>=26.2",
    "polars==1.12.0",
    "protobuf==4.25.3",
    "pyiqa==0.1.13",
    "python-dateutil==2.9.0.post0",
    "pytorch-lightning==2.2.1",
    "regex==2023.12.25",
    "scipy==1.12.0",
    "sentencepiece==0.1.99",
    "setuptools<70",
    "tensorboard==2.16.2",
    "timm==0.9.16",
    "tokenizers==0.15.1",
    "torch==2.2.2",
    "torchaudio==2.2.2",
    "torchsde==0.2.6",
    "torchvision==0.17.2",
    "transformers==4.37.2",
    "wandb==0.19.8",
    "wheel>=0.47.0",
    "xformers==0.0.25.post1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
